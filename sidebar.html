<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ava Sidebar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #16213e;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid #0f3460;
    }
    .header h1 { font-size: 1.2em; color: #e94560; }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 85%;
      padding: 10px 15px;
      border-radius: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user-message {
      background: #0f3460;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }
    .ai-message {
      background: #16213e;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }
    .input-area {
      background: #16213e;
      padding: 15px;
      border-top: 2px solid #0f3460;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #1a1a2e;
      color: #eee;
      resize: vertical;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover { background: #c73e54; }
    button:disabled { background: #666; cursor: not-allowed; }
    .config-btn {
      background: #0f3460;
      margin-top: 5px;
      font-size: 12px;
    }
    .error { color: #ff6b6b; font-size: 12px; margin-top: 5px; }
    .loading { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Ava Assistant</h1>
  </div>
  
  <div class="chat-container" id="chatContainer">
    <div class="message ai-message">
      Salut ! Je suis Ava. Comment puis-je t'aider aujourd'hui ?
    </div>
  </div>
  
  <div class="input-area">
    <textarea id="userInput" placeholder="Écris ton message ici..."></textarea>
    <button id="sendBtn">Envoyer</button>
    <button id="configBtn" class="config-btn">⚙️ Configurer API</button>
    <div id="errorMsg" class="error"></div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
